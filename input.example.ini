# Stuntmaster PC input bindings.
# Keyboard names are SDL scancode names; gamepad names use SDL controller
# button/axis names. Pass this file with --input-config.
# F11 or controller Select toggles photo mode; P or R3 freezes/resumes its
# simulation without leaving free camera. Use mouse + WASD + Q/E (Left
# Shift is fast), or left/right sticks + L2 descend/R2 ascend. F5 quick-saves,
# F6 writes a
# timestamped state, F7 toggles a configured 30/60 Hz retimed run, F8 toggles
# widescreen culling, and F9 quick-loads.
# Alt+Enter toggles fullscreen.
# These keys are reserved host controls.

# Movement
keyboard.up=W
keyboard.down=S
keyboard.left=A
keyboard.right=D
# Punch
keyboard.square=J
# Interact
keyboard.circle=E
# Kick
keyboard.triangle=K
# Jump
keyboard.cross=Space
# Parry
keyboard.l1=C
# Stats
keyboard.l2=Tab
# Roll
keyboard.r1=Left Shift
# Strafe
keyboard.r2=Left Ctrl
keyboard.start=Return
keyboard.select=Escape
# A digital pad has no L3/R3, so retail ignores these. L3 dumps the
# --frame-capture-trace ring without disturbing gameplay.
keyboard.l3=F
keyboard.r3=G

gamepad.up=dpup
gamepad.down=dpdown
gamepad.left=dpleft
gamepad.right=dpright
gamepad.square=x
gamepad.circle=b
gamepad.triangle=y
gamepad.cross=a
gamepad.l1=leftshoulder
gamepad.l2=lefttrigger
gamepad.r1=rightshoulder
gamepad.r2=righttrigger
gamepad.start=start
gamepad.select=back
gamepad.l3=leftstick
gamepad.r3=rightstick
gamepad.left_x=leftx
gamepad.left_y=lefty
gamepad.right_x=rightx
gamepad.right_y=righty
