name: Draft release

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: draft-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Rerun the entire build/test/package/SBOM/attest pipeline for the tagged
  # commit, baking the tag value in as the release version. This decouples the
  # draft from any earlier regular-push build: the tag produces its own freshly
  # built and freshly attested artifacts.
  build:
    name: Build and attest the tagged release
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write
    uses: ./.github/workflows/windows-build.yml
    with:
      release_version: ${{ github.ref_name }}

  draft:
    name: Promote the freshly built artifact to a draft release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: write

    steps:
      - name: Download the freshly built release files
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir release-assets

      - name: Verify release files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(release-assets/stuntmaster-pc-*-windows-x64.exe)
          files=(release-assets/*)
          if (( ${#artifacts[@]} != 1 )); then
            echo "Expected exactly one release executable, found ${#artifacts[@]}." >&2
            exit 1
          fi
          artifact="${artifacts[0]}"
          source_archive="${artifact%-windows-x64.exe}-corresponding-source.zip"
          expected=(
            "$artifact"
            "$artifact.sha256"
            "$artifact.spdx.json"
            "$artifact.sbom.md"
            "$artifact.sbom.sha256"
            "$source_archive"
            "$source_archive.contents.txt"
            "$source_archive.sha256"
          )
          if (( ${#files[@]} != ${#expected[@]} )); then
            echo "Expected exactly ${#expected[@]} release files, found ${#files[@]}." >&2
            printf '  %s\n' "${files[@]}" >&2
            exit 1
          fi
          for path in "${expected[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "Missing expected release file: $path" >&2
              exit 1
            fi
          done
          (
            cd release-assets
            sha256sum --check ./*.sha256
          )
          if ! gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/windows-build.yml" \
              --signer-digest "$GITHUB_SHA" \
              --source-digest "$GITHUB_SHA" \
              --predicate-type https://spdx.dev/Document/v2.3 \
              --deny-self-hosted-runners \
              --format json | jq -e --slurpfile expected "$artifact.spdx.json" \
                'any(.[]; .verificationResult.statement.predicate == $expected[0])' \
                >/dev/null; then
            echo "No verified SPDX predicate exactly matches $artifact.spdx.json." >&2
            exit 1
          fi
          for path in "${expected[@]}"; do
            gh attestation verify "$path" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/windows-build.yml" \
              --signer-digest "$GITHUB_SHA" \
              --source-digest "$GITHUB_SHA" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --deny-self-hosted-runners
          done

      - name: Create draft release for the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A GitHub Release already exists for tag $RELEASE_TAG; refusing to replace it." >&2
            exit 1
          fi
          shopt -s nullglob
          assets=(release-assets/*)
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes "Automated draft for tag $RELEASE_TAG. Review the attached build, replace these notes, choose the appropriate release classification, and publish when ready."
