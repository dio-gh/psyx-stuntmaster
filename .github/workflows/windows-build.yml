name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and package
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Record and verify build inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          git --version
          cmake --version
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          & $vswhere -latest -products '*' -property installationVersion
          $expectedPsyCross = '23284b7ef885eb2cfa19da26c45e18446062a61d'
          $actualPsyCross = git rev-parse HEAD:external/PsyCross
          if ($actualPsyCross -ne $expectedPsyCross) {
            throw "Unexpected PsyCross revision: $actualPsyCross"
          }
          git submodule status --recursive

      - name: Build, test, and package Release
        shell: pwsh
        run: ./tools/package_windows.ps1

      - name: Inspect and hash artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Get-Item -LiteralPath 'dist/stuntmaster-pc-0.0.1-windows-x64.zip'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive.FullName)
          try {
            $entries = @($zip.Entries | Sort-Object FullName)
            $entries | ForEach-Object {
              '{0,12}  {1}' -f $_.Length, $_.FullName
            } | Tee-Object -FilePath 'dist/stuntmaster-pc-0.0.1-windows-x64.contents.txt'
            $forbidden = @($entries | Where-Object {
              $_.FullName -match '(?i)\.(bin|cue|iso|img|chd|mcr|dmp|log)$'
            })
            if ($forbidden.Count -ne 0) {
              throw "Release archive contains forbidden runtime or game data."
            }
          } finally {
            $zip.Dispose()
          }
          $hash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($archive.Name)" | Set-Content -LiteralPath "$($archive.FullName).sha256" -Encoding ascii
          Write-Host "SHA-256: $hash"

      - name: Upload independently built package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stuntmaster-pc-windows-x64-${{ github.sha }}
          path: |
            dist/stuntmaster-pc-0.0.1-windows-x64.zip
            dist/stuntmaster-pc-0.0.1-windows-x64.zip.sha256
            dist/stuntmaster-pc-0.0.1-windows-x64.contents.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
