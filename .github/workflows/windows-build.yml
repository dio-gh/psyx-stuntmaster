name: Windows build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version label to bake into the artifacts (defaults to the project version).'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      release_version:
        description: 'Release version label to bake into the artifacts (defaults to the project version).'
        required: false
        type: string
        default: ''
    outputs:
      artifact_name:
        description: 'Name of the uploaded release artifact bundle.'
        value: ${{ jobs.build.outputs.artifact_name }}

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and package
    runs-on: windows-2022
    timeout-minutes: 15
    outputs:
      artifact_name: ${{ steps.release_metadata.outputs.artifact_name }}
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\build\vcpkg-binary-cache,readwrite
      # Empty on push/PR -> tools resolve "<branch>-<shorthash>"; a tag caller
      # (or workflow_dispatch input) passes the release label to bake in.
      STUNTMASTER_RELEASE_VERSION: ${{ inputs.release_version || '' }}

    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Record and verify build inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          git --version
          cmake --version
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          & $vswhere -latest -products '*' -property installationVersion
          $expectedPsyCross = '23284b7ef885eb2cfa19da26c45e18446062a61d'
          $actualPsyCross = git rev-parse HEAD:external/PsyCross
          if ($actualPsyCross -ne $expectedPsyCross) {
            throw "Unexpected PsyCross revision: $actualPsyCross"
          }
          $cmake = Get-Content -LiteralPath CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(stuntmaster_pc\s+VERSION\s+([^\s\)]+)') {
            throw 'Could not determine the project version from CMakeLists.txt.'
          }
          $projectVersion = $Matches[1]
          $manifestVersion = (Get-Content -LiteralPath vcpkg.json -Raw | ConvertFrom-Json).'version-string'
          if ($manifestVersion -ne $projectVersion) {
            throw "CMake version $projectVersion does not match vcpkg version $manifestVersion."
          }
          Write-Host "Project version: $projectVersion"
          git submodule status --recursive

      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-vs2022-x64-static-release-${{ hashFiles('vcpkg.json', 'triplets/x64-windows-static-release.cmake') }}

      - name: Restore verified FFmpeg source inputs
        id: ffmpeg_source_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/downloads/ffmpeg-8.1.2.tar.xz
            build/downloads/ffmpeg-8.1.2.tar.xz.asc
            build/downloads/ffmpeg-devel.asc
          key: ffmpeg-source-v1-8.1.2-464beb5e7bf0c311e68b45ae2f04e9cc2af88851abb4082231742a74d97b524c-0a0963fccd70597838073f3e31b20f4a4d8cc2b5e577472c9a5a1f22624246f8-397b3becedcd5a98769967ff1ff8501ddc89f8368b8f766e4701377d7dbaabe5

      - name: Verify authentic FFmpeg source inputs
        shell: pwsh
        run: ./tools/build_ffmpeg_windows.ps1 -VerifySourceOnly

      - name: Save verified FFmpeg source inputs
        if: steps.ffmpeg_source_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/downloads/ffmpeg-8.1.2.tar.xz
            build/downloads/ffmpeg-8.1.2.tar.xz.asc
            build/downloads/ffmpeg-devel.asc
          key: ffmpeg-source-v1-8.1.2-464beb5e7bf0c311e68b45ae2f04e9cc2af88851abb4082231742a74d97b524c-0a0963fccd70597838073f3e31b20f4a4d8cc2b5e577472c9a5a1f22624246f8-397b3becedcd5a98769967ff1ff8501ddc89f8368b8f766e4701377d7dbaabe5

      - name: Install and identify FFmpeg build tools
        id: ffmpeg_toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pacman = 'C:\msys64\usr\bin\pacman.exe'
          if (-not (Test-Path -LiteralPath $pacman -PathType Leaf)) {
            throw 'The windows-2022 MSYS2 installation was not found.'
          }
          & $pacman -S --needed --noconfirm nasm tar xz make
          if ($LASTEXITCODE -ne 0) {
            throw "MSYS2 build tool installation failed with exit code $LASTEXITCODE."
          }
          $nasm = 'C:\msys64\usr\bin\nasm.exe'
          $nasmVersion = (& $nasm -v).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $nasmVersion) {
            throw 'Could not identify NASM.'
          }
          $nasmHash = (Get-FileHash -LiteralPath $nasm -Algorithm SHA256).Hash.ToLowerInvariant()
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          $visualStudioVersion = ([string](& $vswhere -latest -products '*' `
            -property installationVersion | Select-Object -Last 1)).Trim()
          $identityText = @(
            "ImageVersion=$env:ImageVersion"
            "VisualStudio=$visualStudioVersion"
            "NASM=$nasmVersion"
            "NASM_SHA256=$nasmHash"
          ) -join "`n"
          $algorithm = [Security.Cryptography.SHA256]::Create()
          try {
            $bytes = [Text.UTF8Encoding]::new($false).GetBytes($identityText)
            $identity = ([BitConverter]::ToString(
              $algorithm.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant()
          } finally {
            $algorithm.Dispose()
          }
          "cache_identity=$identity" >> $env:GITHUB_OUTPUT
          Write-Host $identityText
          Write-Host "FFmpeg toolchain cache identity: $identity"

      - name: Restore verified FFmpeg build cache
        id: ffmpeg_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/dependencies/ffmpeg-8.1.2-msvc-x64-static/install
            build/dependencies/ffmpeg-8.1.2-msvc-x64-static/build-metadata.json
            build/dependencies/ffmpeg-8.1.2-msvc-x64-static/install-manifest.json
          key: ffmpeg-v1-${{ runner.os }}-${{ steps.ffmpeg_toolchain.outputs.cache_identity }}-${{ hashFiles('tools/build_ffmpeg_windows.ps1') }}

      - name: Build and verify minimal static FFmpeg
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          $visualStudioRoot = ([string](& $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath | Select-Object -Last 1)).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $visualStudioRoot) {
            throw 'Visual Studio with the C++ toolchain was not found.'
          }
          ./tools/build_ffmpeg_windows.ps1 -VisualStudioRoot $visualStudioRoot

      - name: Save verified FFmpeg build cache
        if: steps.ffmpeg_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/dependencies/ffmpeg-8.1.2-msvc-x64-static/install
            build/dependencies/ffmpeg-8.1.2-msvc-x64-static/build-metadata.json
            build/dependencies/ffmpeg-8.1.2-msvc-x64-static/install-manifest.json
          key: ffmpeg-v1-${{ runner.os }}-${{ steps.ffmpeg_toolchain.outputs.cache_identity }}-${{ hashFiles('tools/build_ffmpeg_windows.ps1') }}

      - name: Build, test, and package Release
        shell: pwsh
        run: ./tools/package_windows.ps1

      - name: Capture deterministic build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cachePath = 'build/windows/CMakeCache.txt'
          $cache = Get-Content -LiteralPath $cachePath -Raw
          function Get-CacheValue {
            param([Parameter(Mandatory = $true)][string] $Name)
            $pattern = '(?m)^{0}:[^=]*=(.*)$' -f [regex]::Escape($Name)
            $match = [regex]::Match($cache, $pattern)
            if (-not $match.Success) {
              throw "CMake cache value was not found: $Name"
            }
            return $match.Groups[1].Value.Trim()
          }
          function Get-CMakeSetValue {
            param(
              [Parameter(Mandatory = $true)][string] $Content,
              [Parameter(Mandatory = $true)][string] $Name
            )
            $pattern = '(?m)^set\({0}\s+"?([^"\)\r\n]+)"?\)' -f [regex]::Escape($Name)
            $match = [regex]::Match($Content, $pattern)
            if (-not $match.Success) {
              throw "CMake compiler value was not found: $Name"
            }
            return $match.Groups[1].Value.Trim()
          }
          function Get-UniqueProjectValue {
            param(
              [Parameter(Mandatory = $true)][string] $Element,
              [string] $ProjectFilter = '*.vcxproj'
            )
            $values = @(Get-ChildItem -LiteralPath 'build/windows' -Recurse `
              -Filter $ProjectFilter -File | ForEach-Object {
                $content = Get-Content -LiteralPath $_.FullName -Raw
                foreach ($match in [regex]::Matches(
                    $content,
                    '<{0}>([^<]+)</{0}>' -f [regex]::Escape($Element))) {
                  $match.Groups[1].Value.Trim()
                }
              } | Sort-Object -Unique)
            if ($values.Count -ne 1) {
              throw "Expected one $Element value in generated projects, found $($values.Count): $($values -join ', ')"
            }
            return $values[0]
          }
          function Get-ToolEvidence {
            param(
              [Parameter(Mandatory = $true)][string] $Name,
              [Parameter(Mandatory = $true)][string] $Path,
              [switch] $RequireMicrosoftSignature
            )
            $resolvedPath = (Resolve-Path -LiteralPath $Path).Path
            $hash = (Get-FileHash -LiteralPath $resolvedPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $signature = Get-AuthenticodeSignature -FilePath $resolvedPath
            $status = $signature.Status.ToString()
            if ($status -notin @('Valid', 'NotSigned')) {
              throw "Invalid Authenticode status for ${Name}: $status"
            }
            $signerSubject = if ($null -ne $signature.SignerCertificate) {
              [string]$signature.SignerCertificate.Subject
            } else { 'NONE' }
            $signerThumbprint = if ($null -ne $signature.SignerCertificate) {
              [string]$signature.SignerCertificate.Thumbprint
            } else { 'NONE' }
            $timestampSubject = if ($null -ne $signature.TimeStamperCertificate) {
              [string]$signature.TimeStamperCertificate.Subject
            } else { 'NONE' }
            $timestampThumbprint = if ($null -ne $signature.TimeStamperCertificate) {
              [string]$signature.TimeStamperCertificate.Thumbprint
            } else { 'NONE' }
            if ($RequireMicrosoftSignature) {
              if ($status -ne 'Valid') {
                throw "$Name must have a valid Microsoft Authenticode signature."
              }
              if ($signerSubject -notmatch '(?i)(^|,\s*)O=Microsoft Corporation(,|$)') {
                throw "Unexpected Authenticode publisher for ${Name}: $signerSubject"
              }
            }
            return [pscustomobject][ordered]@{
              name = $Name
              file_name = [IO.Path]::GetFileName($resolvedPath)
              sha256 = $hash
              authenticode_status = $status
              signature_required = [bool]$RequireMicrosoftSignature
              signer_subject = $signerSubject
              signer_certificate_sha1 = $signerThumbprint.ToLowerInvariant()
              timestamp_signer_subject = $timestampSubject
              timestamp_certificate_sha1 = $timestampThumbprint.ToLowerInvariant()
            }
          }
          function Get-Sha256String {
            param([Parameter(Mandatory = $true)][string] $Value)
            $algorithm = [Security.Cryptography.SHA256]::Create()
            try {
              $bytes = [Text.UTF8Encoding]::new($false).GetBytes($Value)
              return ([BitConverter]::ToString(
                $algorithm.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant()
            } finally {
              $algorithm.Dispose()
            }
          }
          $compilerFiles = @(Get-ChildItem -LiteralPath 'build/windows/CMakeFiles' `
            -Recurse -Filter 'CMakeCXXCompiler.cmake' -File | Where-Object {
              (Get-Content -LiteralPath $_.FullName -Raw) -match 'CMAKE_CXX_COMPILER_VERSION'
            })
          if ($compilerFiles.Count -ne 1) {
            throw "Expected one CMake C++ compiler metadata file, found $($compilerFiles.Count)."
          }
          $compiler = Get-Content -LiteralPath $compilerFiles[0].FullName -Raw
          $compilerPath = Get-CMakeSetValue $compiler 'CMAKE_CXX_COMPILER'
          $toolsMatch = [regex]::Match(
            $compilerPath,
            '(?i)[/\\]MSVC[/\\]([^/\\]+)[/\\]bin[/\\]')
          if (-not $toolsMatch.Success) {
            throw "Could not determine the MSVC tools version from $compilerPath"
          }
          $msvcToolsVersion = $toolsMatch.Groups[1].Value
          $vsRootMatch = [regex]::Match(
            $compilerPath,
            '(?i)^(.*?)[/\\]VC[/\\]Tools[/\\]MSVC[/\\]')
          if (-not $vsRootMatch.Success) {
            throw "Could not determine the Visual Studio root from $compilerPath"
          }
          $visualStudioRoot = $vsRootMatch.Groups[1].Value
          $compilerDirectory = Split-Path -Parent $compilerPath
          $cmakeCommand = Get-CacheValue 'CMAKE_COMMAND'
          $cmakeVersion = ((& $cmakeCommand --version | Select-Object -First 1) `
            -replace '^cmake version\s+', '').Trim()
          $gitVersion = ((git --version) -replace '^git version\s+', '').Trim()
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudioVersion = ([string](& $vswhere -latest -products '*' `
            -property installationVersion | Select-Object -Last 1)).Trim()
          if (-not $visualStudioVersion) {
            throw 'Could not determine the Visual Studio installation version.'
          }
          $sourceDateEpoch = ([string](git show -s --format=%ct $env:GITHUB_SHA)).Trim()
          if ($sourceDateEpoch -notmatch '^\d+$') {
            throw 'Could not determine SOURCE_DATE_EPOCH.'
          }
          $manifest = Get-Content -LiteralPath vcpkg.json -Raw | ConvertFrom-Json
          $ffmpegMetadata = Get-Content -LiteralPath `
            'build/dependencies/ffmpeg-8.1.2-msvc-x64-static/build-metadata.json' `
            -Raw | ConvertFrom-Json
          if ($ffmpegMetadata.schema_version -ne '1' -or
              $ffmpegMetadata.build_recipe_version -ne '4' -or
              $ffmpegMetadata.ffmpeg_version -ne '8.1.2') {
            throw 'Unexpected FFmpeg build metadata.'
          }
          $nasmVersion = (& 'C:\msys64\usr\bin\nasm.exe' -v).Trim()
          $windowsSdkVersion = Get-UniqueProjectValue 'WindowsTargetPlatformVersion' `
            -ProjectFilter 'stuntmaster.vcxproj'
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} `
            "Windows Kits\10\bin\$windowsSdkVersion\x64"
          $resourceCompiler = Join-Path $sdkBin 'rc.exe'
          $dependencyInspector = Join-Path $compilerDirectory 'dumpbin.exe'
          $stuntmasterExecutable = 'build/windows/Release/stuntmaster.exe'
          $dependencies = @(& $dependencyInspector /dependents $stuntmasterExecutable)
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not inspect the final executable dependency table.'
          }
          $unexpectedFfmpegImport = @($dependencies | Where-Object {
            $_ -match '(?i)\b(avcodec|avformat|avutil|swresample|swscale)-[0-9]+\.dll\b'
          })
          if ($unexpectedFfmpegImport.Count -ne 0) {
            throw "Final executable still imports FFmpeg DLLs: $($unexpectedFfmpegImport -join ', ')"
          }
          $msbuildMetadata = `
            'build/windows/CMakeFiles/StuntmasterMSBuildCommand.txt'
          if (-not (Test-Path -LiteralPath $msbuildMetadata -PathType Leaf)) {
            throw 'CMake did not record its selected MSBuild executable.'
          }
          $msbuild = (Get-Content -LiteralPath $msbuildMetadata -Raw).Trim()
          if (-not $msbuild) {
            throw 'CMake recorded an empty MSBuild executable path.'
          }
          $vcpkg = Join-Path $visualStudioRoot 'VC\vcpkg\vcpkg.exe'
          $cmakeBin = Split-Path -Parent $cmakeCommand
          $git = (Get-Command git.exe -ErrorAction Stop).Source
          $gitRoot = Split-Path -Parent (Split-Path -Parent $git)
          $gpg = Join-Path $gitRoot 'usr\bin\gpg.exe'
          $gpgv = Join-Path $gitRoot 'usr\bin\gpgv.exe'
          $pwsh = (Get-Command pwsh.exe -ErrorAction Stop).Source
          $toolchainTools = @(
            Get-ToolEvidence 'MSVC C/C++ compiler' $compilerPath -RequireMicrosoftSignature
            Get-ToolEvidence 'MSVC linker' (Join-Path $compilerDirectory 'link.exe') -RequireMicrosoftSignature
            Get-ToolEvidence 'MSVC librarian' (Join-Path $compilerDirectory 'lib.exe') -RequireMicrosoftSignature
            Get-ToolEvidence 'MSVC dependency inspector' $dependencyInspector -RequireMicrosoftSignature
            Get-ToolEvidence 'MSBuild' $msbuild -RequireMicrosoftSignature
            Get-ToolEvidence 'Windows resource compiler' $resourceCompiler -RequireMicrosoftSignature
            Get-ToolEvidence 'Windows manifest tool' (Join-Path $sdkBin 'mt.exe') -RequireMicrosoftSignature
            Get-ToolEvidence 'CMake' $cmakeCommand
            Get-ToolEvidence 'CTest' (Join-Path $cmakeBin 'ctest.exe')
            Get-ToolEvidence 'vcpkg' $vcpkg
            Get-ToolEvidence 'Git' $git
            Get-ToolEvidence 'PowerShell' $pwsh
            Get-ToolEvidence 'MSYS2 Bash' 'C:\msys64\usr\bin\bash.exe'
            Get-ToolEvidence 'GNU Make' 'C:\msys64\usr\bin\make.exe'
            Get-ToolEvidence 'NASM' 'C:\msys64\usr\bin\nasm.exe'
            Get-ToolEvidence 'GnuPG' $gpg
            Get-ToolEvidence 'GPG verifier' $gpgv
            Get-ToolEvidence 'curl' ((Get-Command curl.exe -ErrorAction Stop).Source)
            Get-ToolEvidence 'MSYS2 GNU tar' 'C:\msys64\usr\bin\tar.exe'
            Get-ToolEvidence 'XZ Utils' 'C:\msys64\usr\bin\xz.exe'
          )
          $toolchainJson = $toolchainTools | ConvertTo-Json -Depth 6 -Compress
          $toolchainDigest = Get-Sha256String $toolchainJson
          $buildEnvironment = [ordered]@{
            schema_version = '3'
            build_system = 'GitHub Actions'
            runner_image = 'windows-2022'
            runner_image_os = [string]$env:ImageOS
            runner_image_version = [string]$env:ImageVersion
            runner_architecture = [string]$env:RUNNER_ARCH
            visual_studio_version = $visualStudioVersion
            msvc_compiler_id = Get-CMakeSetValue $compiler 'CMAKE_CXX_COMPILER_ID'
            msvc_compiler_version = Get-CMakeSetValue $compiler 'CMAKE_CXX_COMPILER_VERSION'
            msvc_toolset = Get-UniqueProjectValue 'PlatformToolset' -ProjectFilter 'stuntmaster.vcxproj'
            msvc_toolset_version = $msvcToolsVersion
            windows_sdk_version = $windowsSdkVersion
            cmake_version = $cmakeVersion
            cmake_generator = Get-CacheValue 'CMAKE_GENERATOR'
            cmake_generator_platform = Get-CacheValue 'CMAKE_GENERATOR_PLATFORM'
            git_version = $gitVersion
            build_configuration = 'Release'
            vcpkg_triplet = 'x64-windows-static-release'
            vcpkg_builtin_baseline = [string]$manifest.'builtin-baseline'
            source_date_epoch = $sourceDateEpoch
            ffmpeg_version = [string]$ffmpegMetadata.ffmpeg_version
            ffmpeg_source_url = [string]$ffmpegMetadata.source_url
            ffmpeg_source_sha256 = [string]$ffmpegMetadata.source_sha256
            ffmpeg_signature_sha256 = [string]$ffmpegMetadata.signature_sha256
            ffmpeg_release_key_fingerprint = [string]$ffmpegMetadata.release_key_fingerprint
            ffmpeg_configuration_id = [string]$ffmpegMetadata.configuration_id
            ffmpeg_linkage = 'static'
            ffmpeg_configure_options = @($ffmpegMetadata.configure_options)
            nasm_version = $nasmVersion
            reproducibility_options = 'MSVC /Brepro and project IPO; FFmpeg /O2 /Brepro /MT /GL; commit-derived ZIP timestamps and SBOM creation time'
            toolchain_digest_algorithm = 'SHA256'
            toolchain_digest_format = 'UTF-8 compact JSON toolchain_tools array in listed and property order'
            toolchain_digest = $toolchainDigest
            toolchain_tools = $toolchainTools
          }
          foreach ($property in $buildEnvironment.GetEnumerator()) {
            if (-not [string]$property.Value) {
              throw "Build environment value is empty: $($property.Key)"
            }
          }
          $environmentPath = Join-Path (Resolve-Path dist).Path 'build-environment.json'
          [IO.File]::WriteAllText(
            $environmentPath,
            ($buildEnvironment | ConvertTo-Json -Depth 4),
            [Text.UTF8Encoding]::new($false))
          "BUILD_ENVIRONMENT=$environmentPath" >> $env:GITHUB_ENV
          Get-Content -LiteralPath $environmentPath

      - name: Inspect and hash artifact
        id: release_metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifacts = @(Get-ChildItem -LiteralPath dist -Filter 'stuntmaster-pc-*-windows-x64.exe' -File)
          if ($artifacts.Count -ne 1) {
            throw "Expected exactly one release executable, found $($artifacts.Count)."
          }
          $artifact = $artifacts[0]
          $sourceBundles = @(Get-ChildItem -LiteralPath dist `
            -Filter 'stuntmaster-pc-*-corresponding-source.zip' -File)
          if ($sourceBundles.Count -ne 1) {
            throw "Expected exactly one corresponding-source archive, found $($sourceBundles.Count)."
          }
          $sourceBundle = $sourceBundles[0]
          $match = [regex]::Match($artifact.Name, '^stuntmaster-pc-(?<version>.+)-windows-x64\.exe$')
          if (-not $match.Success) {
            throw "Could not extract the project version from $($artifact.Name)."
          }
          # The release artifact is the single self-configuring executable: it
          # has no archive contents to enumerate, so there is no contents.txt.
          $checksumPath = "$($artifact.FullName).sha256"
          $sbomPath = "$($artifact.FullName).spdx.json"
          $sbomSummaryPath = "$($artifact.FullName).sbom.md"
          $sbomChecksumPath = "$($artifact.FullName).sbom.sha256"
          $sourceContentsPath = "$($sourceBundle.FullName).contents.txt"
          $sourceChecksumPath = "$($sourceBundle.FullName).sha256"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $sourceZip = [System.IO.Compression.ZipFile]::OpenRead($sourceBundle.FullName)
          try {
            $sourceEntries = @($sourceZip.Entries | Where-Object { $_.Name } |
              Sort-Object FullName)
            $sourceEntries | ForEach-Object {
              '{0,12}  {1}' -f $_.Length, $_.FullName
            } | Tee-Object -FilePath $sourceContentsPath
            $sourceRoot = "stuntmaster-pc-$($match.Groups['version'].Value)-source/"
            $mainFiles = @(git ls-tree -r --name-only $env:GITHUB_SHA |
              Where-Object { $_ -ne 'external/PsyCross' } | ForEach-Object {
                "$sourceRoot$_"
              })
            $psyCrossFiles = @(git -C external/PsyCross ls-tree -r --name-only HEAD |
              ForEach-Object { "${sourceRoot}external/PsyCross/$_" })
            $expectedSourceFiles = @(
              $mainFiles
              $psyCrossFiles
              "${sourceRoot}third_party/ffmpeg/ffmpeg-8.1.2.tar.xz"
              "${sourceRoot}third_party/ffmpeg/ffmpeg-8.1.2.tar.xz.asc"
              "${sourceRoot}third_party/ffmpeg/ffmpeg-devel.asc"
              "${sourceRoot}SOURCE-PROVENANCE.json"
            ) | Sort-Object
            $actualSourceFiles = @($sourceEntries.FullName | Sort-Object)
            $difference = @(Compare-Object $expectedSourceFiles $actualSourceFiles)
            if ($difference.Count -ne 0) {
              $details = $difference | ForEach-Object {
                "$($_.SideIndicator) $($_.InputObject)"
              }
              throw "Corresponding-source archive differs from its exact allowlist:`n$($details -join "`n")"
            }
            if ($actualSourceFiles | Where-Object {
                $_.Contains('\\') -or $_ -match '(^|/)\.\.?(?:/|$)'
              }) {
              throw 'Corresponding-source archive contains an unsafe path.'
            }
          } finally {
            $sourceZip.Dispose()
          }
          $hash = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($artifact.Name)" | Set-Content -LiteralPath $checksumPath -Encoding ascii
          $sourceHash = (Get-FileHash -LiteralPath $sourceBundle.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sourceHash  $($sourceBundle.Name)" | Set-Content `
            -LiteralPath $sourceChecksumPath -Encoding ascii
          "RELEASE_ARCHIVE=$($artifact.FullName)" >> $env:GITHUB_ENV
          "RELEASE_CHECKSUM=$checksumPath" >> $env:GITHUB_ENV
          "RELEASE_SBOM=$sbomPath" >> $env:GITHUB_ENV
          "RELEASE_SBOM_SUMMARY=$sbomSummaryPath" >> $env:GITHUB_ENV
          "RELEASE_SBOM_CHECKSUM=$sbomChecksumPath" >> $env:GITHUB_ENV
          "RELEASE_SOURCE_BUNDLE=$($sourceBundle.FullName)" >> $env:GITHUB_ENV
          "RELEASE_SOURCE_CONTENTS=$sourceContentsPath" >> $env:GITHUB_ENV
          "RELEASE_SOURCE_CHECKSUM=$sourceChecksumPath" >> $env:GITHUB_ENV
          "RELEASE_VERSION=$($match.Groups['version'].Value)" >> $env:GITHUB_ENV
          $artifactName = "stuntmaster-pc-windows-x64-$($match.Groups['version'].Value)-$env:GITHUB_SHA"
          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT
          Write-Host "SHA-256: $hash"
          Write-Host "Corresponding-source SHA-256: $sourceHash"

      - name: Generate SPDX SBOM
        shell: pwsh
        run: |
          ./tools/generate_sbom.ps1 `
            -Archive $env:RELEASE_ARCHIVE `
            -OutputPath $env:RELEASE_SBOM `
            -SourceCommit $env:GITHUB_SHA `
            -SourceRepository $env:GITHUB_REPOSITORY `
            -BuildEnvironmentPath $env:BUILD_ENVIRONMENT `
            -SummaryPath $env:RELEASE_SBOM_SUMMARY
          $sbomHash = (Get-FileHash -LiteralPath $env:RELEASE_SBOM -Algorithm SHA256).Hash.ToLowerInvariant()
          $summaryHash = (Get-FileHash -LiteralPath $env:RELEASE_SBOM_SUMMARY -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$sbomHash  $([IO.Path]::GetFileName($env:RELEASE_SBOM))"
            "$summaryHash  $([IO.Path]::GetFileName($env:RELEASE_SBOM_SUMMARY))"
          ) | Set-Content -LiteralPath $env:RELEASE_SBOM_CHECKSUM -Encoding ascii
          Write-Host "SBOM SHA-256: $sbomHash"
          Write-Host "Human-readable SBOM SHA-256: $summaryHash"

      - name: Upload independently built package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release_metadata.outputs.artifact_name }}
          path: |
            ${{ env.RELEASE_ARCHIVE }}
            ${{ env.RELEASE_CHECKSUM }}
            ${{ env.RELEASE_SBOM }}
            ${{ env.RELEASE_SBOM_SUMMARY }}
            ${{ env.RELEASE_SBOM_CHECKSUM }}
            ${{ env.RELEASE_SOURCE_BUNDLE }}
            ${{ env.RELEASE_SOURCE_CONTENTS }}
            ${{ env.RELEASE_SOURCE_CHECKSUM }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  attest:
    name: Attest release executable and SBOM
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Download the completed build artifact
        env:
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir attestation-input

      - name: Verify and locate attestation inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(attestation-input/stuntmaster-pc-*-windows-x64.exe)
          files=(attestation-input/*)
          if (( ${#artifacts[@]} != 1 )); then
            echo "Expected exactly one release executable, found ${#artifacts[@]}." >&2
            exit 1
          fi
          artifact="${artifacts[0]}"
          expected=(
            "$artifact"
            "$artifact.sha256"
            "$artifact.spdx.json"
            "$artifact.sbom.md"
            "$artifact.sbom.sha256"
            "${artifact%-windows-x64.exe}-corresponding-source.zip"
            "${artifact%-windows-x64.exe}-corresponding-source.zip.contents.txt"
            "${artifact%-windows-x64.exe}-corresponding-source.zip.sha256"
          )
          if (( ${#files[@]} != ${#expected[@]} )); then
            echo "Expected exactly ${#expected[@]} attestation inputs, found ${#files[@]}." >&2
            printf '  %s\n' "${files[@]}" >&2
            exit 1
          fi
          for path in "${expected[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "Missing expected attestation input: $path" >&2
              exit 1
            fi
          done
          (
            cd attestation-input
            sha256sum --check ./*.sha256
          )
          echo "subject=$artifact" >> "$GITHUB_OUTPUT"
          echo "sbom=$artifact.spdx.json" >> "$GITHUB_OUTPUT"

      - name: Create GitHub SBOM attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ steps.inputs.outputs.subject }}
          sbom-path: ${{ steps.inputs.outputs.sbom }}

      - name: Create GitHub provenance attestation for every published file
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: attestation-input/*
